<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>erst_dev_adblocker</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="header">
    <div class="header-brand">
        <h1>erst_dev_adblocker</h1>
        <!-- Версия подставляется из манифеста через loadVersion() в popup.js -->
        <div class="version" id="version-label">v…</div>
    </div>
    <button type="button" id="open-settings" class="icon-btn"
            title="Settings" aria-label="Settings"
            data-i18n-title="settings" data-i18n-aria-label="settings">
        <span aria-hidden="true">⚙</span>
    </button>
</div>

<main id="view-main" class="view">
    <label class="toggle-switch">
        <input type="checkbox" id="enabled-toggle">
        <span class="toggle-slider"></span>
        <span class="toggle-label" id="toggle-label" data-i18n="toggleOn"></span>
    </label>

    <div class="section">
        <div class="section-title" data-i18n="whitelistTitle"></div>
        <div id="whitelist-empty" class="empty" data-i18n="whitelistEmpty"></div>
        <ul id="whitelist" class="whitelist"></ul>
        <button id="add-current" class="btn-add" data-i18n="addCurrent"></button>
    </div>

    <div class="note" data-i18n="whitelistNote"></div>

    <button id="reload-page" class="btn-reload" style="display: none;" data-i18n="reloadPage"></button>

    <div class="feedback">
        <a href="#" id="feedback-bug" class="feedback-link" data-i18n="reportProblem"></a>
        <a href="#" id="feedback-copy" class="feedback-link" data-i18n="copyEmail"></a>
    </div>
</main>

<section id="view-settings" class="view" hidden>
    <div class="settings-header">
        <button type="button" id="close-settings" class="back-btn">
            <span aria-hidden="true">←</span>
            <span data-i18n="back"></span>
        </button>
        <h2 class="settings-title" data-i18n="settingsTitle"></h2>
    </div>

    <div class="section">
        <div class="section-title" data-i18n="languageTitle"></div>
        <div id="language-list" class="language-list"></div>
        <div class="note" data-i18n="languageNote"></div>
    </div>
</section>

<script type="module" src="popup.js"></script>
</body>
</html>
